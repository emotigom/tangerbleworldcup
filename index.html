<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grid Field Editor</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1020;
      --panel: #141b2e;
      --panel-strong: #1d2740;
      --line: #34415f;
      --text: #eef3ff;
      --muted: #aab5ca;
      --accent: #66d19e;
      --accent-strong: #38b982;
      --danger: #ff7b7b;
      --focus: #9ec5ff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #182442 0, var(--bg) 42rem);
      color: var(--text);
      font-family: Pretendard, "Noto Sans KR", system-ui, sans-serif;
    }

    button,
    input { font: inherit; }

    button {
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel-strong);
      color: var(--text);
      cursor: pointer;
    }

    button:hover { border-color: #60729a; }
    button:focus-visible,
    canvas:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
    button[aria-pressed="true"] { border-color: var(--accent); background: #174936; }
    button.danger { color: #ffd6d6; }

    .app {
      display: grid;
      grid-template-columns: minmax(220px, 270px) minmax(0, 1fr);
      gap: 18px;
      width: min(1240px, 100%);
      margin: 0 auto;
      padding: 18px;
    }

    .panel {
      align-self: start;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: color-mix(in srgb, var(--panel) 94%, transparent);
      box-shadow: 0 18px 50px rgb(0 0 0 / 22%);
    }

    h1 { margin: 0; font-size: 1.3rem; }
    h2 { margin: 20px 0 9px; font-size: .82rem; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
    p { margin: 8px 0 0; color: var(--muted); font-size: .9rem; line-height: 1.55; }

    .button-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .button-grid .wide { grid-column: 1 / -1; }
    .legend { display: grid; gap: 7px; margin-top: 12px; color: var(--muted); font-size: .82rem; }
    .legend span { display: flex; align-items: center; gap: 8px; }
    .swatch { width: 12px; height: 12px; border-radius: 3px; background: currentColor; }

    .workspace { min-width: 0; }

    .canvas-shell {
      overflow: auto;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #080c17;
      box-shadow: 0 18px 50px rgb(0 0 0 / 24%);
    }

    canvas {
      display: block;
      width: 100%;
      max-width: 960px;
      height: auto;
      margin: 0 auto;
      border-radius: 8px;
      background: #1d6648;
      cursor: crosshair;
      touch-action: none;
    }

    .status {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      min-height: 24px;
      margin: 10px 2px 0;
      color: var(--muted);
      font-size: .86rem;
    }

    footer {
      grid-column: 1 / -1;
      padding: 2px 6px 12px;
      color: var(--muted);
      font-size: .78rem;
      line-height: 1.6;
    }

    @media (max-width: 820px) {
      .app { grid-template-columns: 1fr; padding: 12px; }
      .panel { position: static; }
      footer { grid-column: auto; }
    }
  </style>
</head>
<body>
  <main class="app">
    <aside class="panel" aria-label="편집 도구">
      <h1>Grid Field Editor</h1>
      <p>그리드 맵 설계와 동선 점검</p>

      <h2>배치</h2>
      <div class="button-grid" id="tools">
        <button type="button" data-tool="start" aria-pressed="true">시작점</button>
        <button type="button" data-tool="target" aria-pressed="false">도착점</button>
        <button type="button" data-tool="marker" aria-pressed="false">마커</button>
        <button type="button" data-tool="wall" aria-pressed="false">장애물</button>
        <button type="button" data-tool="eraser" class="wide danger" aria-pressed="false">지우개</button>
      </div>

      <h2>경로 점검</h2>
      <div class="button-grid">
        <button type="button" id="turnLeft">왼쪽 회전</button>
        <button type="button" id="turnRight">오른쪽 회전</button>
        <button type="button" id="moveForward" class="wide">한 칸 전진</button>
        <button type="button" id="resetRunner" class="wide">시작점으로</button>
      </div>

      <h2>파일</h2>
      <div class="button-grid">
        <button type="button" id="saveMap">JSON 저장</button>
        <button type="button" id="loadMap">JSON 불러오기</button>
        <button type="button" id="clearMap" class="wide danger">맵 초기화</button>
      </div>
      <input id="fileInput" type="file" accept="application/json,.json" hidden>

      <div class="legend" aria-label="도형 범례">
        <span><i class="swatch" style="color:#65a9ff"></i>시작점</span>
        <span><i class="swatch" style="color:#fff3a6"></i>도착점</span>
        <span><i class="swatch" style="color:#ffad5c"></i>마커</span>
        <span><i class="swatch" style="color:#ef6464"></i>장애물</span>
      </div>
    </aside>

    <section class="workspace" aria-label="그리드 편집 영역">
      <div class="canvas-shell">
        <canvas id="board" width="960" height="720" tabindex="0" aria-label="16열 12행 그리드 맵"></canvas>
      </div>
      <div class="status" role="status" aria-live="polite">
        <span id="statusText">시작점을 배치하세요.</span>
        <span>회전: ← → / 이동: ↑ 또는 W</span>
      </div>
    </section>

    <footer>
      Original utility by Ahn Sangkyoon · 비공식 독립 도구 · Tangible Africa 및 Leva Foundation과 제휴·승인 관계가 없습니다. 관련 명칭·제품·앱·교육 콘텐츠의 권리는 각 권리자에게 있습니다.
    </footer>
  </main>

  <script>
    "use strict";

    const COLS = 16;
    const ROWS = 12;
    const CELL = 60;
    const ITEM_TYPES = new Set(["start", "target", "marker", "wall"]);
    const DIRECTIONS = ["up", "right", "down", "left"];

    const canvas = document.getElementById("board");
    const ctx = canvas.getContext("2d");
    const statusText = document.getElementById("statusText");
    const fileInput = document.getElementById("fileInput");
    const toolButtons = [...document.querySelectorAll("[data-tool]")];

    let currentTool = "start";
    let items = [];
    let runner = { x: 0, y: 0, dir: "right", active: false };
    let dragging = false;
    let dragAction = "add";

    function setStatus(message) {
      statusText.textContent = message;
    }

    function selectTool(tool) {
      currentTool = tool;
      toolButtons.forEach((button) => {
        button.setAttribute("aria-pressed", String(button.dataset.tool === tool));
      });
      setStatus(`${toolLabel(tool)} 선택`);
    }

    function toolLabel(tool) {
      return { start: "시작점", target: "도착점", marker: "마커", wall: "장애물", eraser: "지우개" }[tool];
    }

    function inside(x, y) {
      return Number.isInteger(x) && Number.isInteger(y) && x >= 0 && x < COLS && y >= 0 && y < ROWS;
    }

    function cellFromPointer(event) {
      const rect = canvas.getBoundingClientRect();
      const x = Math.floor(((event.clientX - rect.left) / rect.width) * COLS);
      const y = Math.floor(((event.clientY - rect.top) / rect.height) * ROWS);
      return { x, y };
    }

    function itemAt(x, y, type) {
      return items.find((item) => item.x === x && item.y === y && (!type || item.type === type));
    }

    function removeAt(x, y) {
      const before = items.length;
      items = items.filter((item) => item.x !== x || item.y !== y);
      if (before !== items.length) setStatus(`(${x + 1}, ${y + 1}) 삭제`);
      const start = items.find((item) => item.type === "start");
      if (!start) runner.active = false;
    }

    function placeAt(x, y) {
      if (!inside(x, y)) return;

      if (currentTool === "eraser") {
        removeAt(x, y);
        return;
      }

      if (currentTool === "start" || currentTool === "target") {
        items = items.filter((item) => item.type !== currentTool && (item.x !== x || item.y !== y));
        removeAt(x, y);
        items.push({ type: currentTool, x, y });
        if (currentTool === "start") resetRunner();
        setStatus(`${toolLabel(currentTool)} (${x + 1}, ${y + 1})`);
        return;
      }

      const existing = itemAt(x, y, currentTool);
      if (existing) {
        items = items.filter((item) => item !== existing);
        setStatus(`${toolLabel(currentTool)} 삭제`);
        return;
      }

      removeAt(x, y);
      items.push({ type: currentTool, x, y });
      setStatus(`${toolLabel(currentTool)} (${x + 1}, ${y + 1})`);
    }

    function resetRunner() {
      const start = items.find((item) => item.type === "start");
      if (!start) {
        runner.active = false;
        setStatus("시작점을 먼저 배치하세요.");
        return;
      }
      runner = { x: start.x, y: start.y, dir: "right", active: true };
      setStatus("시작점으로 이동");
    }

    function rotate(step) {
      if (!runner.active) return resetRunner();
      const index = DIRECTIONS.indexOf(runner.dir);
      runner.dir = DIRECTIONS[(index + step + DIRECTIONS.length) % DIRECTIONS.length];
      setStatus(step < 0 ? "왼쪽 회전" : "오른쪽 회전");
    }

    function moveForward() {
      if (!runner.active) return resetRunner();
      const delta = { up: [0, -1], right: [1, 0], down: [0, 1], left: [-1, 0] }[runner.dir];
      const next = { x: runner.x + delta[0], y: runner.y + delta[1] };
      if (!inside(next.x, next.y)) return setStatus("그리드 경계입니다.");
      if (itemAt(next.x, next.y, "wall")) return setStatus("장애물이 있습니다.");
      runner.x = next.x;
      runner.y = next.y;
      setStatus(itemAt(next.x, next.y, "target") ? "도착점에 도달했습니다." : `(${next.x + 1}, ${next.y + 1})`);
    }

    function drawGrid() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let y = 0; y < ROWS; y += 1) {
        for (let x = 0; x < COLS; x += 1) {
          ctx.fillStyle = (x + y) % 2 === 0 ? "#236d50" : "#1e6549";
          ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
        }
      }
      ctx.strokeStyle = "rgba(235, 255, 244, .2)";
      ctx.lineWidth = 1;
      for (let x = 0; x <= COLS; x += 1) {
        ctx.beginPath();
        ctx.moveTo(x * CELL + .5, 0);
        ctx.lineTo(x * CELL + .5, canvas.height);
        ctx.stroke();
      }
      for (let y = 0; y <= ROWS; y += 1) {
        ctx.beginPath();
        ctx.moveTo(0, y * CELL + .5);
        ctx.lineTo(canvas.width, y * CELL + .5);
        ctx.stroke();
      }
    }

    function drawItem(item) {
      const cx = item.x * CELL + CELL / 2;
      const cy = item.y * CELL + CELL / 2;
      ctx.save();

      if (item.type === "start") {
        ctx.fillStyle = "#65a9ff";
        ctx.beginPath();
        ctx.arc(cx, cy, 17, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#d7e9ff";
        ctx.lineWidth = 4;
        ctx.stroke();
      }

      if (item.type === "target") {
        ctx.fillStyle = "#fff3a6";
        ctx.fillRect(cx - 18, cy - 18, 36, 36);
        ctx.fillStyle = "#20283d";
        ctx.fillRect(cx - 18, cy - 18, 18, 18);
        ctx.fillRect(cx, cy, 18, 18);
      }

      if (item.type === "marker") {
        ctx.translate(cx, cy);
        ctx.rotate(Math.PI / 4);
        ctx.fillStyle = "#ffad5c";
        ctx.fillRect(-15, -15, 30, 30);
        ctx.strokeStyle = "#ffe2bf";
        ctx.lineWidth = 3;
        ctx.strokeRect(-15, -15, 30, 30);
      }

      if (item.type === "wall") {
        ctx.fillStyle = "#ef6464";
        ctx.fillRect(cx - 21, cy - 14, 42, 28);
        ctx.strokeStyle = "#ffd1d1";
        ctx.lineWidth = 3;
        ctx.strokeRect(cx - 21, cy - 14, 42, 28);
        ctx.strokeStyle = "rgba(70, 12, 12, .35)";
        ctx.beginPath();
        ctx.moveTo(cx - 15, cy - 10);
        ctx.lineTo(cx - 3, cy + 10);
        ctx.moveTo(cx + 1, cy - 10);
        ctx.lineTo(cx + 13, cy + 10);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawRunner() {
      if (!runner.active) return;
      const cx = runner.x * CELL + CELL / 2;
      const cy = runner.y * CELL + CELL / 2;
      const angle = { up: -Math.PI / 2, right: 0, down: Math.PI / 2, left: Math.PI }[runner.dir];
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(angle);
      ctx.fillStyle = "#111827";
      ctx.beginPath();
      ctx.arc(0, 0, 13, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.moveTo(23, 0);
      ctx.lineTo(4, -10);
      ctx.lineTo(4, 10);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function render() {
      drawGrid();
      items.forEach(drawItem);
      drawRunner();
      requestAnimationFrame(render);
    }

    function mapData() {
      return {
        format: "grid-field-map",
        version: 1,
        grid: { columns: COLS, rows: ROWS },
        items,
        runner
      };
    }

    function saveMap() {
      const blob = new Blob([JSON.stringify(mapData(), null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement("a");
      anchor.href = url;
      anchor.download = `grid-field-${new Date().toISOString().slice(0, 10)}.json`;
      anchor.click();
      URL.revokeObjectURL(url);
      setStatus("JSON 저장 완료");
    }

    function sanitizeItems(value) {
      if (!Array.isArray(value)) throw new Error("items 배열이 없습니다.");
      const clean = [];
      const occupied = new Set();
      const singleton = new Set();
      for (const raw of value) {
        if (!raw || !ITEM_TYPES.has(raw.type) || !inside(raw.x, raw.y)) continue;
        if ((raw.type === "start" || raw.type === "target") && singleton.has(raw.type)) continue;
        const cellKey = `${raw.x}:${raw.y}`;
        if (occupied.has(cellKey)) continue;
        clean.push({ type: raw.type, x: raw.x, y: raw.y });
        occupied.add(cellKey);
        singleton.add(raw.type);
      }
      return clean;
    }

    async function loadMap(file) {
      const data = JSON.parse(await file.text());
      if (data.format !== "grid-field-map" || data.version !== 1) throw new Error("지원하지 않는 맵 형식입니다.");
      items = sanitizeItems(data.items);
      const start = items.find((item) => item.type === "start");
      const loadedRunner = data.runner;
      if (loadedRunner && loadedRunner.active && inside(loadedRunner.x, loadedRunner.y) && DIRECTIONS.includes(loadedRunner.dir)) {
        runner = { x: loadedRunner.x, y: loadedRunner.y, dir: loadedRunner.dir, active: true };
      } else if (start) {
        runner = { x: start.x, y: start.y, dir: "right", active: true };
      } else {
        runner = { x: 0, y: 0, dir: "right", active: false };
      }
      setStatus("JSON 불러오기 완료");
    }

    toolButtons.forEach((button) => button.addEventListener("click", () => selectTool(button.dataset.tool)));

    canvas.addEventListener("pointerdown", (event) => {
      const cell = cellFromPointer(event);
      if (!inside(cell.x, cell.y)) return;
      dragging = currentTool === "wall" || currentTool === "eraser";
      dragAction = currentTool === "wall" && itemAt(cell.x, cell.y, "wall") ? "remove" : "add";
      canvas.setPointerCapture(event.pointerId);
      if (dragAction === "remove") removeAt(cell.x, cell.y);
      else placeAt(cell.x, cell.y);
    });

    canvas.addEventListener("pointermove", (event) => {
      if (!dragging) return;
      const cell = cellFromPointer(event);
      if (!inside(cell.x, cell.y)) return;
      if (currentTool === "eraser" || dragAction === "remove") removeAt(cell.x, cell.y);
      else if (!itemAt(cell.x, cell.y, "wall")) placeAt(cell.x, cell.y);
    });

    canvas.addEventListener("pointerup", () => { dragging = false; });
    canvas.addEventListener("pointercancel", () => { dragging = false; });

    document.getElementById("turnLeft").addEventListener("click", () => rotate(-1));
    document.getElementById("turnRight").addEventListener("click", () => rotate(1));
    document.getElementById("moveForward").addEventListener("click", moveForward);
    document.getElementById("resetRunner").addEventListener("click", resetRunner);
    document.getElementById("saveMap").addEventListener("click", saveMap);
    document.getElementById("loadMap").addEventListener("click", () => fileInput.click());
    document.getElementById("clearMap").addEventListener("click", () => {
      if (!window.confirm("현재 맵을 초기화할까요?")) return;
      items = [];
      runner = { x: 0, y: 0, dir: "right", active: false };
      setStatus("맵 초기화 완료");
    });

    fileInput.addEventListener("change", async () => {
      const file = fileInput.files && fileInput.files[0];
      if (!file) return;
      try {
        await loadMap(file);
      } catch (error) {
        setStatus(`불러오기 실패: ${error.message}`);
      } finally {
        fileInput.value = "";
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.target instanceof HTMLInputElement) return;
      if (event.key === "ArrowLeft" || event.key.toLowerCase() === "a") rotate(-1);
      if (event.key === "ArrowRight" || event.key.toLowerCase() === "d") rotate(1);
      if (event.key === "ArrowUp" || event.key.toLowerCase() === "w") moveForward();
      if (["ArrowLeft", "ArrowRight", "ArrowUp"].includes(event.key)) event.preventDefault();
    });

    render();
  </script>
</body>
</html>
